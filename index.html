<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Мой бюджет</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: dark-first iOS feel — pill toolbar on top, big month figure, day-grouped cards, floating round dock; full-screen stacked sheets for entry and pages */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --pill:#FFFFFF; --key:#FFFFFF; --key2:#E5E5EA; --layer:#F2F2F7;
  --fg:#111113; --fg2:#6E6E73; --fg3:#C7C7CC; --sep:rgba(60,60,67,.12); --fill:rgba(118,118,128,.12);
  --accent:#007AFF; --pos:#1E9E46; --neg:#FF3B30; --warn:#FF9500; --exp:#F28A00; --tr:#007AFF;
  --fab:#1C1C1E; --fab-fg:#FFFFFF; --cta:#1C1C1E; --cta-fg:#FFFFFF; --cta-off:#D1D1D6;
  --bar:rgba(242,242,247,.86); --scrim:rgba(0,0,0,.28); --toast:#1C1C1E; --toast-fg:#FFFFFF; --toast-a:#0A84FF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1A1A1C; --pill:#1C1C1E; --key:#28282A; --key2:#1A1A1C; --layer:#000000;
  --fg:#F5F5F7; --fg2:#8E8E93; --fg3:#3A3A3C; --sep:rgba(84,84,88,.45); --fill:rgba(118,118,128,.22);
  --accent:#0A84FF; --pos:#30D158; --neg:#FF453A; --warn:#FF9F0A; --exp:#FF9F0A; --tr:#0A84FF;
  --fab:#E8E8ED; --fab-fg:#000000; --cta:#E8E8ED; --cta-fg:#000000; --cta-off:#2C2C2E;
  --bar:rgba(0,0,0,.82); --scrim:rgba(0,0,0,.6); --toast:#2C2C2E; --toast-fg:#FFFFFF; --toast-a:#64D2FF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1A1A1C; --pill:#1C1C1E; --key:#28282A; --key2:#1A1A1C; --layer:#000000;
  --fg:#F5F5F7; --fg2:#8E8E93; --fg3:#3A3A3C; --sep:rgba(84,84,88,.45); --fill:rgba(118,118,128,.22);
  --accent:#0A84FF; --pos:#30D158; --neg:#FF453A; --warn:#FF9F0A; --exp:#FF9F0A; --tr:#0A84FF;
  --fab:#E8E8ED; --fab-fg:#000000; --cta:#E8E8ED; --cta-fg:#000000; --cta-off:#2C2C2E;
  --bar:rgba(0,0,0,.82); --scrim:rgba(0,0,0,.6); --toast:#2C2C2E; --toast-fg:#FFFFFF; --toast-a:#64D2FF; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.i{width:24px;height:24px;flex:none;display:block}
.hide{display:none!important}

/* app shell + stacked-sheet effect */
#app{min-height:100%;background:var(--bg);transition:transform .45s var(--ease),border-radius .45s var(--ease),filter .45s var(--ease)}
body.stacked #app{transform:scale(.92);border-radius:16px;filter:brightness(.55);overflow:hidden}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.wpill{display:flex;align-items:center;gap:10px;background:var(--pill);border-radius:999px;padding:5px 16px 5px 5px;min-width:0;max-width:58%;text-align:left}
.wpill .t{display:flex;flex-direction:column;min-width:0}
.wpill .n{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wpill .b{font-size:13px;color:var(--fg2);white-space:nowrap}
.tools{margin-left:auto;display:flex;background:var(--pill);border-radius:999px;padding:3px}
.tools button,.circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform .15s var(--ease),background .2s}
.tools button:active,.circ:active{transform:scale(.9);background:var(--fill)}
.circ{background:var(--pill);flex:none}

/* tile = rounded square with tinted icon */
.tile{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 20%,transparent)}
.tile .i{width:22px;height:22px}
.tile.round{border-radius:50%}

/* home */
main.wrap{padding-block:4px calc(130px + env(safe-area-inset-bottom,0px))}
.view{animation:viewIn .4s var(--ease) both}
@keyframes viewIn{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 0 18px;text-align:center}
.hrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.ghost{color:var(--fg2);font-size:17px;display:flex;align-items:center;gap:4px;padding:6px 2px}
.ghost .i{width:16px;height:16px}
.mpill{display:flex;align-items:center;background:var(--pill);border-radius:999px;padding:3px}
.mpill button{height:36px;min-width:36px;border-radius:999px;display:grid;place-items:center;font-weight:600;font-size:16px}
.mpill button.l{padding:0 8px;min-width:118px}
.mpill .i{width:18px;height:18px}
.mpill button:active{background:var(--fill)}
.hnum{font-size:52px;font-weight:700;letter-spacing:-.035em;line-height:1.05;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.hnum.pos{color:var(--pos)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cbtn{display:flex;align-items:center;gap:7px;background:var(--pill);border-radius:999px;padding:9px 15px;font-size:15px;font-weight:500}
.cbtn .i{width:18px;height:18px}
.cbtn.warn{color:var(--warn)} .cbtn.over{color:var(--neg)}
.day{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.dayh{display:flex;justify-content:space-between;gap:8px;padding:0 6px;font-size:15px;color:var(--fg2)}
.list{background:var(--card);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;min-height:64px;width:100%;text-align:left;position:relative}
.row + .row::before{content:"";position:absolute;top:0;right:0;left:64px;border-top:.5px solid var(--sep)}
button.row:active{background:var(--fill)}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t1{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .am{font-size:17px;font-weight:600;white-space:nowrap}
.am.pos{color:var(--pos)} .am.trc{color:var(--fg2)}
.row.new{animation:flash 1.2s var(--ease)}
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 22%,transparent)}100%{background:transparent}}
.more{display:block;width:100%;padding:16px;color:var(--accent);font-weight:500;text-align:center}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:70px 24px 20px;text-align:center}
.empty .art{width:96px;height:96px;color:var(--fg3)}
.empty b{font-size:20px}
.empty p{margin:0;color:var(--fg2);font-size:16px;line-height:1.45;max-width:30ch}
.card{background:var(--card);border-radius:22px}
.promo{display:flex;flex-direction:column;gap:12px;padding:18px;margin-top:8px}
.promo b{font-size:18px}
.promo p{margin:0;color:var(--fg2);font-size:15px;line-height:1.4}
.promo .acts{display:flex;gap:10px}
.btn{height:46px;border-radius:14px;font-weight:600;font-size:16px;padding:0 18px;display:flex;align-items:center;justify-content:center;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--cta);color:var(--cta-fg)}
.btn.soft{background:var(--fill)}
.btn.danger{width:100%;background:var(--card);color:var(--neg)}
.btn.danger.armed{background:var(--neg);color:#FFFFFF}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;align-items:center;gap:18px;padding:0 0 calc(18px + env(safe-area-inset-bottom,0px));pointer-events:none;transition:opacity .3s,transform .45s var(--ease)}
.dock button{pointer-events:auto;border-radius:50%;display:grid;place-items:center;background:var(--fab);color:var(--fab-fg);box-shadow:0 8px 28px rgba(0,0,0,.28);transition:transform .2s var(--ease)}
.dock button:active{transform:scale(.9)}
.dock .s{width:60px;height:60px}
.dock .s .i{width:26px;height:26px}
.dock .b{width:78px;height:78px}
.dock .b .i{width:34px;height:34px}
body.stacked .dock{opacity:0;transform:translateY(40px)}
body.stacked .dock button{pointer-events:none}

/* layers */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
#s1{z-index:20}#l1{z-index:21}#s2{z-index:30}#l2{z-index:31}#s3{z-index:40}#l3{z-index:41}
.layer{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--layer);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .48s var(--ease),filter .4s;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.layer.full{top:calc(env(safe-area-inset-top,0px) + 12px)}
.layer:not(.full){max-height:calc(100% - 60px - env(safe-area-inset-top,0px));background:var(--layer)}
.layer.on{transform:none}
.layer.drag{transition:none}
.layer.behind{filter:brightness(.6)}
.grip{width:38px;height:5px;border-radius:3px;background:var(--fg3);margin:8px auto 0}
.lhead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 0 8px;position:sticky;top:0;z-index:2;background:var(--layer)}
.lhead h2{margin:0;font-size:18px;font-weight:600;text-align:center}
.lhead .sp{width:44px}
.txtbtn{color:var(--accent);font-size:17px;padding:10px 4px}
.txtbtn.b{font-weight:600}
.titlepill{justify-self:center;background:var(--pill);border-radius:999px;padding:10px 18px;font-weight:600;font-size:17px}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{font-size:13px;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em;padding:14px 8px 0}
.note{font-size:13px;color:var(--fg2);padding:0 8px;line-height:1.45;margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.seg button{height:34px;border-radius:9px;font-size:15px;font-weight:500;transition:background .25s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--key);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* wallets page */
.allrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:22px;padding:20px 22px;width:100%;font-size:18px;font-weight:500}
.wrow{display:flex;align-items:center;gap:14px;padding:12px 10px 12px 12px;width:100%;text-align:left;position:relative}
.wrow + .wrow::before{content:"";position:absolute;top:0;right:0;left:70px;border-top:.5px solid var(--sep)}
.wrow .tile{width:48px;height:48px;border-radius:50%}
.wrow .n{flex:1;min-width:0;font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .v{font-size:17px;white-space:nowrap}
.wrow .ed{width:40px;height:40px;display:grid;place-items:center;color:var(--fg2);border-radius:50%}
.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.check{color:var(--accent)}

/* editor */
.ed-wrap{display:flex;flex-direction:column;gap:10px;min-height:100%}
.typeseg{justify-self:center;display:flex;background:var(--pill);border-radius:999px;padding:4px;gap:2px}
.typeseg button{display:flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:999px;color:var(--c);font-weight:600;font-size:16px;transition:background .3s var(--ease),padding .3s var(--ease)}
.typeseg button .i{width:20px;height:20px}
.typeseg button span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .35s var(--ease)}
.typeseg button.on{background:color-mix(in srgb,var(--c) 22%,transparent);padding:0 16px}
.typeseg button.on span{max-width:110px}
.amtbox{flex:1;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 0}
.amtbox .ex{font-size:18px;color:var(--fg2);min-height:22px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amtbox .big{font-size:64px;font-weight:600;letter-spacing:-.04em;line-height:1;white-space:nowrap;max-width:100%;transition:font-size .2s}
.amtbox .big.m{font-size:50px}.amtbox .big.s{font-size:40px}
.amtbox.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.edrow{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:8px;background:var(--pill);border-radius:999px;min-height:52px;padding:5px 16px 5px 5px;min-width:0;text-align:left;position:relative}
.pill .t{display:flex;flex-direction:column;min-width:0}
.pill .n{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .b{font-size:12px;color:var(--fg2);white-space:nowrap}
.pill .tile{width:40px;height:40px;border-radius:50%}
.datep{margin-left:auto;padding:0 18px;font-size:16px;font-weight:500;flex:none;gap:6px}
.datep .tm{color:var(--fg2)}
.datep input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;-webkit-appearance:none;appearance:none;font-size:16px}
.edrow .arrow{color:var(--fg2);flex:none}
.edrow .pill.wp{flex:1;max-width:46%}
.edrow.trr .pill.wp{max-width:none;flex:1 1 0}
.edrow .noteinp{flex:1;min-width:0}
body.stacked .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translate(-50%,-20px)}
body.stacked .toast.on{transform:translate(-50%,0)}
.noteinp{width:100%;height:52px;border-radius:18px;border:0;background:var(--pill);color:var(--fg);font:inherit;font-size:17px;padding:0 18px}
.noteinp::placeholder{color:var(--fg2)}
.noteinp:focus{outline:none}
.catbox{background:var(--pill);border-radius:22px;padding:12px 0 10px}
.cats{display:flex;gap:10px;overflow-x:auto;padding:4px 14px;scroll-snap-type:x proximity;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;scroll-snap-align:center}
.cat .tile{width:54px;height:54px;border-radius:16px;transition:transform .25s var(--ease),box-shadow .25s}
.cat .tile .i{width:26px;height:26px}
.cat[aria-pressed="true"] .tile{transform:scale(1.08);box-shadow:0 0 0 2px var(--pill),0 0 0 4px var(--c)}
.catname{text-align:center;font-size:15px;color:var(--fg2);margin-top:8px;font-weight:500}
.keys{display:grid;grid-template-columns:1fr 1fr 1fr .62fr;gap:7px}
.keys button{height:54px;border-radius:16px;background:var(--key);font-size:26px;font-weight:400;display:grid;place-items:center;transition:transform .1s,background .15s}
.keys button.op{background:var(--key2);font-size:24px}
.keys button.fn{background:var(--key2)}
.keys button:active{transform:scale(.94);background:var(--fill)}
.cta{height:58px;border-radius:20px;background:var(--cta);color:var(--cta-fg);font-size:18px;font-weight:600;width:100%;transition:transform .15s var(--ease),background .2s,color .2s}
.cta:active{transform:scale(.98)}
.cta.off{background:var(--cta-off);color:var(--fg2)}

/* forms */
.form{background:var(--card);border-radius:18px;overflow:hidden}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px;position:relative}
.field + .field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.field label{flex:none}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:17px;text-align:right;padding:12px 0}
.field input::placeholder{color:var(--fg2);opacity:.7}
.field input:focus{outline:none}
.field .u{color:var(--fg2)}
.picks{display:flex;gap:10px;flex-wrap:wrap;padding:4px 2px}
.picks button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transition:transform .2s var(--ease)}
.picks button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--layer),0 0 0 4px var(--fg)}
.picks .sw{background:var(--c)}
.picks .ic{background:var(--card);color:var(--fg)}
.wprev{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0}
.wprev .tile{width:72px;height:72px;border-radius:50%}
.wprev .tile .i{width:34px;height:34px}
.bigin{display:flex;justify-content:center;align-items:baseline;gap:6px;padding:8px 0}
.bigin input{font:inherit;font-size:44px;font-weight:700;letter-spacing:-.03em;border:0;background:transparent;color:var(--fg);text-align:center;width:6ch;max-width:75%;font-variant-numeric:tabular-nums;caret-color:var(--accent)}
.bigin input:focus{outline:none}
.bigin input::placeholder{color:var(--fg3)}
.bigin span{font-size:30px;color:var(--fg2);font-weight:600}

/* analytics / budgets */
.pad{padding:18px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.minis > div{background:var(--fill);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.minis span{font-size:12px;color:var(--fg2)}
.minis b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donut-wrap{position:relative;width:220px;max-width:100%;aspect-ratio:1;margin:6px auto 4px}
.donut{width:100%;height:100%;display:block}
.donut circle.s{transition:stroke-dasharray 1s var(--ease)}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.donut-c span{font-size:13px;color:var(--fg2)}
.donut-c b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.bar{display:block;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--c);transition:width .9s var(--ease)}
.brow{display:flex;flex-direction:column;gap:8px;padding:14px 16px;width:100%;text-align:left;position:relative}
.brow + .brow::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.brow .h{display:flex;align-items:center;gap:12px}
.brow .h .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.brow .h .nm b{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .h .nm span{font-size:13px;color:var(--fg2)}
.brow .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--fg2)}
.chip{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{color:var(--pos);background:color-mix(in srgb,var(--pos) 15%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 17%,transparent)}

.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:170px;margin-top:14px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-width:0}
.col .v{font-size:11px;color:var(--fg2);white-space:nowrap}
.col .bb{width:100%;max-width:34px;height:0;border-radius:8px 8px 4px 4px;background:var(--fill);transition:height .9s var(--ease)}
.col.cur .bb{background:var(--c)}
.col.cur .v,.col.cur .m{color:var(--fg);font-weight:600}

.search .i{width:20px;height:20px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:17px}

.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--toast);color:var(--toast-fg);border-radius:999px;padding:12px 18px;font-size:15px;font-weight:500;display:flex;gap:14px;align-items:center;transition:opacity .25s,transform .35s var(--ease);max-width:calc(100% - 32px);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--toast-a);font-weight:600}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const pad=n=>String(n).padStart(2,'0');

/* ================= хранилище на устройстве ================= */
const DB=(()=>{
  let db=null;
  function open(){return new Promise(res=>{
    try{const r=indexedDB.open('moi-budget',1);
      r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('tx'))d.createObjectStore('tx',{keyPath:'id'});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');};
      r.onsuccess=()=>{db=r.result;res(true);};r.onerror=()=>res(false);r.onblocked=()=>res(false);
    }catch(e){res(false);}
  });}
  function req(store,mode,fn){return new Promise(res=>{
    if(!db)return res(null);
    try{const t=db.transaction(store,mode);const q=fn(t.objectStore(store));
      t.oncomplete=()=>res(q&&'result' in q?q.result:true);t.onerror=()=>res(null);t.onabort=()=>res(null);
    }catch(e){res(null);}
  });}
  return{open,
    allTx:()=>req('tx','readonly',s=>s.getAll()),
    putTx:v=>req('tx','readwrite',s=>s.put(v)),
    putMany:a=>req('tx','readwrite',s=>{a.forEach(v=>s.put(v));return null;}),
    delTx:id=>req('tx','readwrite',s=>s.delete(id)),
    delMany:ids=>req('tx','readwrite',s=>{ids.forEach(id=>s.delete(id));return null;}),
    clearTx:()=>req('tx','readwrite',s=>s.clear()),
    get:k=>req('kv','readonly',s=>s.get(k)),
    set:(k,v)=>req('kv','readwrite',s=>s.put(v,k))};
})();

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seedDemo(){
  const card=newWallet({id:'w_card',name:'Карта',icon:'card',color:'#0A84FF',initial:120000});
  const cash=newWallet({id:'w_cash',name:'Наличные',icon:'cash',color:'#30D158',initial:15000});
  const r=rng(42),out=[],now=new Date(),pick=a=>a[Math.floor(r()*a.length)],amt=(lo,hi,st)=>Math.round((lo+r()*(hi-lo))/st)*st;
  for(let back=5;back>=0;back--){
    const f=new Date(now.getFullYear(),now.getMonth()-back,1);
    const last=back===0?now.getDate():new Date(f.getFullYear(),f.getMonth()+1,0).getDate();
    const add=(day,type,cat,amount,note,w,to)=>{if(day<1||day>last)return;const t={id:uid(),type,cat,amount,note:note||'',walletId:w||card.id,date:iso(new Date(f.getFullYear(),f.getMonth(),day)),ts:Date.now()-out.length};if(to)t.toWallet=to;out.push(t);};
    add(5,'inc','salary',340000,'Аванс');add(20,'inc','salary',340000,'Зарплата');
    if(r()>.4)add(12,'inc','side',amt(40000,90000,5000),'Проект');
    add(15,'inc','cashback',amt(3000,9000,100),'Кэшбэк по карте');
    add(3,'exp','home',180000,'Аренда');add(10,'exp','bills',amt(24000,32000,100),'Коммунальные');add(8,'exp','bills',5990,'Мобильная связь');
    add(6,'tr','transfer',20000,'Снял наличные',card.id,cash.id);
    for(let d=1;d<=last;d+=2+Math.floor(r()*3))add(d,'exp','food',amt(5000,19000,10),pick(['Супермаркет','Рынок','Продукты на неделю','Магазин у дома']),r()>.75?cash.id:card.id);
    const cn=back===0?Math.min(11,Math.ceil(last*.4)):6+Math.floor(r()*5);
    for(let i=0;i<cn;i++)add(1+Math.floor(r()*last),'exp','cafe',amt(2200,9500,100),pick(['Кофе','Обед','Ужин с друзьями','Завтрак','Доставка']),r()>.6?cash.id:card.id);
    for(let i=0;i<10;i++)add(1+Math.floor(r()*last),'exp','transport',amt(700,3500,50),pick(['Такси','Автобус','Бензин']),r()>.5?cash.id:card.id);
    for(let i=0;i<2;i++)add(1+Math.floor(r()*last),'exp','fun',amt(3500,14000,500),pick(['Кино','Боулинг','Концерт']));
    if(r()>.5)add(1+Math.floor(r()*last),'exp','health',amt(3000,18000,100),'Аптека');
    if(r()>.5)add(1+Math.floor(r()*last),'exp','shopping',amt(9000,45000,500),pick(['Кроссовки','Куртка','Наушники']));
    if(r()>.6)add(1+Math.floor(r()*last),'exp','beauty',amt(4000,9000,500),'Стрижка',cash.id);
  }
  return{wallets:[card,cash],tx:out};
}

function countUp(el,from,to,fmt){
  if(from===null||from===to||matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=fmt(to);return;}
  const t0=performance.now(),dur=600;
  (function st(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(st);})(t0);
}

function stackFx(){

/* ================= ввод операции ================= */
let D=null;
const OPS='+−×÷';
function openEditor(id,type){
  const ex=id?S.tx.find(t=>t.id===id):null;
  const w=curW(),defW=w!=='all'?w:(S.settings.lastWallet&&W(S.settings.lastWallet)?S.settings.lastWallet:S.wallets[0].id);
  if(!ex&&type==='tr'&&S.wallets.length<2){toast('Для перевода нужен второй счёт');openPage('wallets');setTimeout(()=>openWalletEdit(),350);return;}
  D=ex?{id:ex.id,type:ex.type,expr:String(ex.amount).replace('.',','),cat:ex.cat,walletId:ex.walletId,toWallet:ex.toWallet||null,date:ex.date,note:ex.note||''}
      :{id:null,type:type||'exp',expr:'',cat:null,walletId:defW,toWallet:null,date:S.month===ym(new Date())?today():S.month+'-01',note:''};
  if(D.type==='tr'&&!D.toWallet)D.toWallet=(S.wallets.find(x=>x.id!==D.walletId)||{}).id;
  if(D.type!=='tr'&&!D.cat)D.cat=CATS[D.type][0].id;
  if(D.type!=='tr'&&!CAT[D.cat]&&LEGACY[D.cat])D.cat=LEGACY[D.cat];
  drawEditor();
}
const wPill=(id,act)=>{const w=W(id)||{name:'Выберите',icon:'wallet',color:'#8E8E93'};return `<button class="pill wp" data-a="${act}">${tileW(w)}<span class="t"><span class="n">${esc(w.name)}</span><span class="b num">${W(id)?signed(balance(id)):''}</span></span></button>`;};
function drawEditor(){
  const t=D.type;
  const types=['inc','exp','tr'].map(k=>`<button data-a="edType" data-t="${k}" class="${t===k?'on':''}" style="--c:${TYPES[k].c}" aria-pressed="${t===k}">${ic(TYPES[k].i)}<span>${TYPES[k].l}</span></button>`).join('');
  const datePill=`<label class="pill datep"><span id="edDateL">${shortDate(D.date)}</span><input type="date" id="edDate" value="${D.date}" aria-label="Дата"></label>`;
  const cats=t==='tr'?'':`<div class="catbox"><div class="cats" id="cats">${CATS[t].map(c=>`<button class="cat" data-a="edCat" data-id="${c.id}" aria-pressed="${D.cat===c.id}" aria-label="${esc(c.name)}" style="--c:${c.color}">${tileC(c)}</button>`).join('')}</div><div class="catname" id="catname">${esc(catOf(D.cat).name)}</div></div>`;
  const keys=['1','2','3','+','4','5','6','−','7','8','9','×',',','0','⌫','÷'].map(k=>`<button data-a="key" data-k="${k}" class="${OPS.includes(k)?'op':k==='⌫'||k===','?'fn':''}" aria-label="${k==='⌫'?'Стереть':k}">${k==='⌫'?ic('back'):k}</button>`).join('');
  openL(2,`<div class="ed-wrap">
    ${head(2,`<div class="typeseg" role="group" aria-label="Тип операции">${types}</div>`,D.id?`<button class="circ" data-a="edDel" aria-label="Удалить" style="color:var(--neg)">${ic('trash')}</button>`:'')}
    <div class="amtbox" id="amtbox"><div class="ex num" id="edEx"></div><div class="big num" id="edAmt"></div></div>
    <div class="edrow ${t==='tr'?'trr':''}">${wPill(D.walletId,'edWallet')}${t==='tr'?`<span class="arrow">${ic('right')}</span>${wPill(D.toWallet,'edWalletTo')}`:datePill}</div>
    <div class="edrow"><input class="noteinp" id="edNote" maxlength="80" placeholder="Заметка" value="${esc(D.note)}" enterkeyhint="done">${t==='tr'?datePill:''}</div>
    ${cats}
    <div class="keys">${keys}</div>
    <button class="cta" data-a="edSave" id="edSave">${D.id?'Сохранить изменения':'Сохранить'}</button>
  </div>`,el=>{
    el.querySelector('#edDate').addEventListener('change',e=>{if(e.target.value){D.date=e.target.value;$('#edDateL').textContent=shortDate(D.date);}});
    el.querySelector('#edNote').addEventListener('input',e=>D.note=e.target.value);
    el.querySelector('#edNote').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
    const sel=el.querySelector('.cat[aria-pressed="true"]');if(sel)sel.scrollIntoView({inline:'center',block:'nearest'});
    edUpdate();
  });
}
function fmtTyped(s){if(!s)return '0';const [a,b]=s.split(',');const n=a?nf.format(+a):'0';return s.includes(',')?n+','+(b||''):n;}
function evalExpr(e){
  const tk=(e.match(/[+−×÷]|[0-9,]+/g)||[]);while(tk.length&&OPS.includes(tk[tk.length-1]))tk.pop();
  if(!tk.length)return 0;
  const vals=[parseAmount(tk[0])],ops=[];
  for(let i=1;i<tk.length;i+=2){const op=tk[i],v=parseAmount(tk[i+1]);
    if(op==='×')vals[vals.length-1]*=v;else if(op==='÷')vals[vals.length-1]=v?vals[vals.length-1]/v:0;else{ops.push(op);vals.push(v);}}
  let r=vals[0];ops.forEach((op,i)=>{r=op==='+'?r+vals[i+1]:r-vals[i+1];});
  return Math.round(r*100)/100;
}
function edUpdate(){
  const e=D.expr,hasOp=/[+−×÷]/.test(e.slice(1));
  const big=$('#edAmt');
  big.textContent=(hasOp?nf.format(evalExpr(e)):fmtTyped(e))+' ₸';
  $('#edEx').textContent=hasOp?e.split(/([+−×÷])/).map(x=>OPS.includes(x)?' '+x+' ':fmtTyped(x)).join(''):'';
  const len=big.textContent.length;big.classList.toggle('m',len>9&&len<=12);big.classList.toggle('s',len>12);
  const ok=evalExpr(e)>0&&(D.type!=='tr'||(D.walletId&&D.toWallet&&D.walletId!==D.toWallet));
  $('#edSave').classList.toggle('off',!ok);
}
function edKey(k){
  let e=D.expr;const last=e.split(/[+−×÷]/).pop();
  if(k==='⌫')e=e.slice(0,-1);
  else if(OPS.includes(k)){if(!e)return;const lc=e.slice(-1);if(OPS.includes(lc)||lc===',')e=e.slice(0,-1)+k;else e+=k;}
  else if(k===','){if(last.includes(','))return;e+=last===''?'0,':',';}
  else{if(last==='0')e=e.slice(0,-1)+k;else{if(last.includes(',')&&last.split(',')[1].length>=2)return;if(last.replace(',','').length>=10)return;e+=k;}}
  D.expr=e;edUpdate();
}
function edSave(){
  const a=evalExpr(D.expr);
  if(!(a>0)){const b=$('#amtbox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return;}
  if(D.type==='tr'&&(!D.toWallet||D.toWallet===D.walletId)){toast('Выберите два разных счёта');return;}
  const rec={type:D.type,amount:a,cat:D.type==='tr'?'transfer':D.cat,walletId:D.walletId,date:D.date,note:(D.note||'').trim()};
  if(D.type==='tr')rec.toWallet=D.toWallet;
  let t;
  if(D.id){t=S.tx.find(x=>x.id===D.id);Object.assign(t,rec);if(D.type!=='tr')delete t.toWallet;}
  else{t=Object.assign({id:uid(),ts:Date.now()},rec);S.tx.push(t);}
  DB.putTx(t);S.lastId=t.id;S.settings.lastWallet=D.walletId;
  if(!S.settings.onboarded){S.settings.onboarded=true;}saveSettings();
  S.month=D.date.slice(0,7);closeL(2);refresh();toast(D.id?'Изменения сохранены':'Сохранено');
}

/* ================= резервная копия ================= */
async function exportData(){
  const data=JSON.stringify({app:'moi-budget',version:2,exported:new Date().toISOString(),wallets:S.wallets,tx:S.tx,budgets:S.budgets});
  const name='budget-'+today()+'.json';
  try{const f=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Резервная копия бюджета'});toast('Копия готова');return;}}
  catch(e){if(e&&e.name==='AbortError')return;}
  try{const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Файл сохранён в «Загрузки»');}
  catch(e){toast('Не удалось сохранить файл');}
}
function importFile(f){
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);if(!j||!Array.isArray(j.tx))throw 0;
    if(Array.isArray(j.wallets))j.wallets.forEach(w=>{if(w&&w.id&&!W(w.id))S.wallets.push(newWallet({id:String(w.id),name:String(w.name||'Счёт'),icon:WICONS.includes(w.icon)?w.icon:'wallet',color:/^#[0-9a-f]{6}$/i.test(w.color)?w.color:'#8E8E93',initial:+w.initial||0}));});
    const def=S.wallets[0].id,have=new Set(S.tx.map(t=>t.id));
    const fresh=j.tx.filter(t=>t&&t.id&&!have.has(t.id)&&['exp','inc','tr'].includes(t.type)&&+t.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)).map(t=>{const o={id:String(t.id),type:t.type,amount:+t.amount,cat:String(t.cat||''),date:t.date,note:String(t.note||''),ts:+t.ts||0,walletId:W(t.walletId)?t.walletId:def};if(t.type==='tr'){o.toWallet=W(t.toWallet)?t.toWallet:def;o.cat='transfer';}return o;});
    S.tx.push(...fresh);DB.putMany(fresh);saveWallets();
    if(j.budgets&&typeof j.budgets==='object'){Object.entries(j.budgets).forEach(([k,v])=>{if(+v>0)S.budgets[k]=+v;});saveBudgets();}
    S.settings.onboarded=true;S.settings.demo=false;saveSettings();refresh();toast(fresh.length?'Добавлено операций: '+fresh.length:'Новых операций в файле нет');
  }catch(e){toast('Этот файл не похож на копию бюджета');}};
  r.readAsText(f);
}
function resetAll(){
  const ids=S.tx.map(t=>t.id);S.tx=[];S.budgets={};DB.clearTx();
  S.wallets=[newWallet({id:'w_main'})];S.settings.wallet='w_main';S.settings.demo=false;S.settings.onboarded=false;S.settings.lastWallet=null;
  saveWallets();saveBudgets();saveSettings();S.shownTop=null;S.month=ym(new Date());
}

};

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const n=topLayer();if(n)closeL(n);return;}
  if(topLayer()===2&&D&&!(document.activeElement&&document.activeElement.tagName==='INPUT')){
    const map={'*':'×','/':'÷','-':'−','+':'+','.':',',',':',','Backspace':'⌫'};
    if(/^[0-9]$/.test(e.key))edKey(e.key);else if(map[e.key])edKey(map[e.key]);else if(e.key==='Enter')edSave();else return;
    e.preventDefault();
  }
});

})();
})();
