<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1012" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Мой бюджет</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: tabbed app — swipeable wallet cards on top, month summary tiles, day-grouped operations; bottom tab bar with a raised square add key; bottom-sheet editor with category grid and flat keypad */
:root{
  --bg:#F3F4F6; --card:#FFFFFF; --card2:#F7F8FA; --fg:#14171A; --fg2:#6B7280; --fg3:#C9CDD3;
  --sep:rgba(20,23,26,.09); --fill:rgba(20,23,26,.06);
  --accent:#0B8F6E; --accent-soft:rgba(11,143,110,.12); --on-accent:#FFFFFF;
  --pos:#0B8F6E; --neg:#E5484D; --warn:#E08A00; --exp:#E5484D; --inc:#0B8F6E; --tr:#3E63DD;
  --bar:rgba(255,255,255,.9); --scrim:rgba(10,12,14,.35); --toast:#14171A; --toast-fg:#FFFFFF; --toast-a:#5EE6C0;
  --allcard:#2F3640;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1012; --card:#181B1F; --card2:#20242A; --fg:#EEF0F2; --fg2:#8A9099; --fg3:#3A4048;
  --sep:rgba(255,255,255,.08); --fill:rgba(255,255,255,.07);
  --accent:#34D1A6; --accent-soft:rgba(52,209,166,.16); --on-accent:#05271E;
  --pos:#34D1A6; --neg:#FF6369; --warn:#FFB224; --exp:#FF6369; --inc:#34D1A6; --tr:#7C9CFF;
  --bar:rgba(20,23,26,.92); --scrim:rgba(0,0,0,.6); --toast:#2A2F36; --toast-fg:#FFFFFF; --toast-a:#5EE6C0;
  --allcard:#2A313B; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1012; --card:#181B1F; --card2:#20242A; --fg:#EEF0F2; --fg2:#8A9099; --fg3:#3A4048;
  --sep:rgba(255,255,255,.08); --fill:rgba(255,255,255,.07);
  --accent:#34D1A6; --accent-soft:rgba(52,209,166,.16); --on-accent:#05271E;
  --pos:#34D1A6; --neg:#FF6369; --warn:#FFB224; --exp:#FF6369; --inc:#34D1A6; --tr:#7C9CFF;
  --bar:rgba(20,23,26,.92); --scrim:rgba(0,0,0,.6); --toast:#2A2F36; --toast-fg:#FFFFFF; --toast-a:#5EE6C0;
  --allcard:#2A313B; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.rnd{font-family:var(--round)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.i{width:22px;height:22px;flex:none;display:block}

main.wrap{padding-block:6px calc(104px + env(safe-area-inset-bottom,0px))}
.view{animation:vin .35s var(--ease) both}
@keyframes vin{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}

/* header */
.hh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 6px}
.lt{font-family:var(--round);font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0}
.mpick{display:flex;align-items:center;gap:2px}
.mpick button{height:36px;min-width:30px;display:grid;place-items:center;border-radius:10px;color:var(--fg2)}
.mpick .l{font-family:var(--round);font-size:22px;font-weight:700;color:var(--fg);padding:0 4px;letter-spacing:-.01em}
.mpick button:active{background:var(--fill)}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ibtn:active{transform:scale(.94)}
.subrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 0}
.chipbtn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;background:var(--card);font-size:14px;font-weight:600;color:var(--fg)}
.chipbtn .i{width:16px;height:16px;color:var(--fg2)}

/* wallet cards */
.wcar{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:8px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:4px max(16px,env(safe-area-inset-left,0px)) 6px;scrollbar-width:none;scroll-padding:0 max(16px,env(safe-area-inset-left,0px))}
.wcar::-webkit-scrollbar{display:none}
.wcard{flex:0 0 84%;max-width:400px;scroll-snap-align:start;border-radius:22px;padding:16px 18px;min-height:156px;display:flex;flex-direction:column;color:#FFFFFF;position:relative;overflow:hidden;text-align:left;cursor:pointer;
  background:linear-gradient(140deg,color-mix(in srgb,var(--c) 82%,#000) 0%,color-mix(in srgb,var(--c) 45%,#000) 100%);transition:opacity .25s linear}
.wcard::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.wcard:not(.on){opacity:.6}
.wc-top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.wc-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.wc-ic .i{width:18px;height:18px}
.wc-n{flex:1;min-width:0;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc-ed{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#FFFFFF}
.wc-ed .i{width:16px;height:16px}
.wc-l{margin-top:auto;font-size:13px;opacity:.75;position:relative;z-index:1}
.wc-b{font-family:var(--round);font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
.wc-f{font-size:13px;opacity:.8;margin-top:4px;position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard.add{background:var(--card);color:var(--fg2);align-items:center;justify-content:center;gap:8px;flex-basis:44%;font-weight:600;opacity:1;transform:none}
.wcard.add::after{display:none}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0 2px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--fg3);transition:width .3s var(--ease),background .3s}
.dots i.on{width:18px;background:var(--fg)}

/* summary tiles */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#hb{margin-top:14px}
.st{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.st .lb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg2)}
.st .dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.st .dot .i{width:14px;height:14px}
.st b{font-family:var(--round);font-size:21px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alertrow{display:flex;align-items:center;gap:10px;margin-top:10px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--c) 13%,var(--card));color:var(--fg);width:100%;text-align:left;font-size:14px}
.alertrow .i{color:var(--c);width:20px;height:20px}
.alertrow span{flex:1}
.alertrow .go{width:16px;height:16px;color:var(--fg2)}

/* lists */
.sech{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 2px}
.sech h2{font-family:var(--round);font-size:20px;font-weight:700;margin:0}
.sech span{font-size:13px;color:var(--fg2)}
.dayh{display:flex;justify-content:space-between;gap:8px;padding:14px 4px 6px;font-size:12px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.06em}
.list{background:var(--card);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:62px;width:100%;text-align:left;position:relative}
.row + .row::before{content:"";position:absolute;top:0;right:14px;left:64px;border-top:1px solid var(--sep)}
button.row:active{background:var(--fill)}
.sw{position:relative;overflow:hidden;transition:height .3s var(--ease),opacity .3s}
.sw + .sw::before{content:"";position:absolute;top:0;right:14px;left:64px;border-top:1px solid var(--sep);z-index:2}
.sw .row{background:var(--card);z-index:1;touch-action:pan-y;transition:transform .28s var(--ease)}
.sw .row.drag{transition:none}
.sw .row:active{background:var(--card)}
.swbg{position:absolute;inset:0;display:flex;justify-content:flex-end;background:var(--neg);visibility:hidden}
.sw.rev .swbg{visibility:visible}
.swdel{width:92px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#FFFFFF;font-size:12px;font-weight:600;transition:width .2s var(--ease)}
.swdel .i{width:22px;height:22px}
.sw.full .swdel{width:100%}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .am{font-family:var(--round);font-size:16px;font-weight:700;white-space:nowrap}
.am.pos{color:var(--pos)} .am.trc{color:var(--tr)}
.row.new::after{content:"";position:absolute;inset:0;background:var(--accent-soft);pointer-events:none;animation:flash 1.4s var(--ease) forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.ci{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#FFFFFF}
.ci .i{width:19px;height:19px}
.more{display:block;width:100%;padding:16px;color:var(--accent);font-weight:600;text-align:center}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 24px 26px;text-align:center}
.empty .art{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.empty .art .i{width:30px;height:30px}
.empty b{font-family:var(--round);font-size:19px}
.empty p{margin:0;color:var(--fg2);font-size:15px;line-height:1.45;max-width:32ch}
.promo{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.promo b{font-size:17px}
.promo p{margin:0;color:var(--fg2);font-size:14px;line-height:1.45}
.promo .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:44px;border-radius:12px;font-weight:600;font-size:15px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--fill)}
.btn.danger{width:100%;background:var(--card);color:var(--neg);height:50px}
.btn.danger.armed{background:var(--neg);color:#FFFFFF}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--sep);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:62px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:9px;color:var(--fg2);font-size:10.5px;font-weight:600}
.tab .i{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.addkey{justify-self:center;align-self:center;width:54px;height:54px;border-radius:17px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transform:translateY(-14px);transition:transform .2s var(--ease)}
.addkey .i{width:28px;height:28px}
.addkey:active{transform:translateY(-14px) scale(.92)}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
#s1{z-index:20}#l1{z-index:21}#s2{z-index:30}#l2{z-index:31}#s3{z-index:40}#l3{z-index:41}
.layer{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .45s var(--ease);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));padding:0 max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -12px 40px rgba(0,0,0,.2)}
.layer.full{top:calc(env(safe-area-inset-top,0px) + 24px)}
.layer.on{transform:none}
.layer.drag{transition:none}
.grip{width:40px;height:5px;border-radius:3px;background:var(--fg3);margin:8px auto 0}
.lhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:50px;position:sticky;top:0;z-index:2;background:var(--bg)}
.lhead h2{margin:0;font-size:17px;font-weight:700;text-align:center;font-family:var(--round)}
.lhead .l{justify-self:start}.lhead .r{justify-self:end}
.txtbtn{color:var(--accent);font-size:16px;font-weight:500;padding:10px 2px}
.txtbtn.b{font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{font-size:12px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.06em;padding:12px 4px 0}
.note{font-size:13px;color:var(--fg2);padding:0 4px;line-height:1.45;margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:12px;padding:3px;gap:3px}
.seg button{height:34px;border-radius:9px;font-size:14px;font-weight:600;color:var(--fg2);transition:background .25s var(--ease),color .25s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* wallets sheet */
.wrow{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left;position:relative;min-height:62px}
.wrow + .wrow::before,.wrow + .addrow::before{content:"";position:absolute;top:0;right:12px;left:12px;border-top:1px solid var(--sep)}
.wrow .pick{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.wrow .n{flex:1;min-width:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .v{font-family:var(--round);font-weight:700;white-space:nowrap}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--fg3);flex:none;display:grid;place-items:center}
.radio.on{border-color:var(--accent)}
.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.wrow .ed{width:36px;height:36px;display:grid;place-items:center;color:var(--fg2);border-radius:10px;background:var(--fill);flex:none}
.wrow .ed .i{width:16px;height:16px}
.addrow{display:flex;align-items:center;gap:12px;padding:14px;width:100%;color:var(--accent);font-weight:600;position:relative}

/* editor */
#l2.on{display:flex;flex-direction:column}
#l2 .ed{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
#l2 .lhead{min-height:46px;grid-template-columns:auto 1fr auto;gap:10px}
.tseg{justify-self:center;display:grid;grid-template-columns:repeat(3,auto);background:var(--fill);border-radius:11px;padding:3px;gap:2px}
.tseg button{height:32px;padding:0 11px;border-radius:8px;font-size:14px;font-weight:600;color:var(--fg2);white-space:nowrap;transition:background .25s var(--ease),color .25s}
.tseg button[aria-pressed="true"]{background:var(--card);color:var(--c);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ed .r-sp{width:36px}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--sep);margin:0 -4px}
.tabs3 button{position:relative;height:42px;font-weight:600;font-size:15px;color:var(--fg2);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs3 button .i{width:16px;height:16px}
.tabs3 button::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--c);transform:scaleX(0);transition:transform .3s var(--ease)}
.tabs3 button[aria-pressed="true"]{color:var(--c)}
.tabs3 button[aria-pressed="true"]::after{transform:none}
.amtp{border-radius:18px;padding:10px 16px;background:color-mix(in srgb,var(--c) 12%,var(--card));display:flex;flex-direction:column;gap:0;justify-content:flex-end;flex:none}
.amtp .lb{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--fg2)}
.amtp .ex{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:65%}
.amtp .big{font-family:var(--round);font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amtp .big small{font-size:28px;color:var(--fg2);margin-left:6px}
.amtp.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.cgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:calc((100% - 44px)/5);gap:8px 8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 6px 2px;margin:0 -6px;flex:none;scrollbar-width:none;scroll-padding:0 6px}
.cgrid.one{grid-template-rows:auto}
.cgrid::-webkit-scrollbar{display:none}
.cg{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--fg2);scroll-snap-align:start;min-width:0}
.cg span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg .ci{width:42px;height:42px;transition:transform .25s var(--ease),box-shadow .25s,opacity .25s;opacity:.55}
.cg .ci .i{width:22px;height:22px}
.cg[aria-pressed="true"]{color:var(--fg);font-weight:700}
.cg[aria-pressed="true"] .ci{opacity:1;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.cell{background:var(--card);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;position:relative;min-height:46px;justify-content:center}
#l2 .cell{padding:6px 12px}
.cell .lab{font-size:11px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
.cell .val{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;min-width:0}
.cell .val .mini{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;background:var(--c);color:#FFFFFF;flex:none}
.cell .val .mini .i{width:12px;height:12px}
.cell .val .tn{overflow:hidden;text-overflow:ellipsis}
.cell input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;-webkit-appearance:none;appearance:none;font-size:16px;cursor:pointer}
.cell.note-c{grid-column:1/-1}
.cell.note-c.half{grid-column:auto}

.save.off{opacity:.4}
.trash{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--neg);background:color-mix(in srgb,var(--neg) 12%,transparent)}

.field .u{color:var(--fg2)}

.swr{display:flex;flex-wrap:wrap;gap:10px}
.sw2{width:40px;height:40px;border-radius:50%;background:var(--c);position:relative;flex:none;transition:transform .2s var(--ease)}

.sw2.custom.set{background:var(--c)}

.colors .names{font-size:12px;color:var(--fg2);margin-top:-6px}

.brow .h .nm span{font-size:12px;color:var(--fg2)}

.brow .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--fg2)}

.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.chip.over{color:var(--neg);background:color-mix(in srgb,var(--neg) 14%,transparent)}

.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-width:0}

.col .m{font-size:12px;color:var(--fg2)}

.amr small{font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}

.paused{opacity:.5}
.soon{display:flex;flex-direction:column;background:color-mix(in srgb,var(--warn) 11%,var(--card));border-radius:16px;padding:4px 0;width:100%;text-align:left;margin-bottom:10px}

.soon .sl .ci{width:28px;height:28px}.soon .sl .ci .i{width:15px;height:15px}

.soon .sl .n{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soon .sl .a{font-family:var(--round);font-weight:700;white-space:nowrap}
.subprev{display:flex;align-items:center;gap:12px;padding:2px 2px}
.subprev .ci{width:52px;height:52px}.subprev .ci .i{width:26px;height:26px}

const DB=(()=>{

  function open(){return new Promise(res=>{
    try{const r=indexedDB.open('moi-budget',1);
      r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('tx'))d.createObjectStore('tx',{keyPath:'id'});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');};

    }catch(e){res(false);}
  });}
  function req(store,mode,fn){return new Promise(res=>{
    if(!db)return res(null);
    try{const t=db.transaction(store,mode);const q=fn(t.objectStore(store));
      t.oncomplete=()=>res(q&&'result' in q?q.result:true);t.onerror=()=>res(null);t.onabort=()=>res(null);
    }catch(e){res(null);}
  });}
  return{open,
    allTx:()=>req('tx','readonly',s=>s.getAll()),
    putTx:v=>req('tx','readwrite',s=>s.put(v)),
    putMany:a=>req('tx','readwrite',s=>{a.forEach(v=>s.put(v));return null;}),
    delTx:id=>req('tx','readwrite',s=>s.delete(id)),
    delMany:ids=>req('tx','readwrite',s=>{ids.forEach(id=>s.delete(id));return null;}),
    clearTx:()=>req('tx','readwrite',s=>s.clear()),
    get:k=>req('kv','readonly',s=>s.get(k)),

})();

function rowHtml(t){
  const w=curW(),c=catOf(t.cat);let sign,cls='';
  if(t.type==='inc'){sign='+';cls='pos';}else if(t.type==='exp'){sign='−';}
  else{if(w==='all'){sign='';cls='trc';}else if(t.toWallet===w){sign='+';cls='pos';}else sign='−';}
  let sub=t.note||'';
  if(t.type==='tr'){const a=W(t.walletId),b=W(t.toWallet);sub=(a?a.name:'?')+' → '+(b?b.name:'?')+(t.note?' · '+t.note:'');}
  else if(w==='all'&&S.wallets.length>1){const a=W(t.walletId);if(a)sub=a.name+(t.note?' · '+t.note:'');}
  return `<div class="sw" data-id="${t.id}"><div class="swbg"><button class="swdel" data-a="swDel" data-id="${t.id}" aria-label="Удалить операцию">${ic('trash')}Удалить</button></div><button class="row${t.id===S.lastId?' new':''}" data-a="edit" data-id="${t.id}">${ciC(c)}<span class="tx"><span class="t1">${esc(c.name)}</span>${sub?`<span class="t2">${esc(sub)}</span>`:''}</span><span class="am num ${cls}">${sign}${money(t.amount)}</span></button></div>`;
}
function groupsHtml(list,withYear){
  const groups=[];list.forEach(t=>{const g=groups[groups.length-1];if(g&&g.date===t.date)g.items.push(t);else groups.push({date:t.date,items:[t]});});
  return groups.map(g=>{const s=sumBy(g.items,'exp');return `<div class="dayh"><span>${dayLabel(g.date)}${withYear&&g.date.slice(0,4)!==String(new Date().getFullYear())?' '+g.date.slice(0,4):''}</span>${s?`<span class="num">−${money(s)}</span>`:''}</div><div class="list">${g.items.map(rowHtml).join('')}</div>`;}).join('');
}
function walletCard(w){
  const id=w.id,on=curW()===id,b=balance(id);

  else{const m=inMonth(S.tx.filter(t=>t.walletId===id&&t.type!=='tr'),S.month);{const i=sumBy(m,'inc'),e=sumBy(m,'exp');foot=`${monthName(S.month)}: доход ${i?'+'+short(i):'0'}, расход ${e?'−'+short(e):'0'}`;}}

    <div class="wc-l">Остаток</div><div class="wc-b num">${signed(b)}</div><div class="wc-f">${foot}</div></div>`;
}
const cardIds=()=>(S.wallets.length>1?['all']:[]).concat(S.wallets.map(w=>w.id));
function renderHome(){

    <div class="wcar" id="wcar">${cards}</div>
    ${ids.length>1?`<div class="dots" id="dots">${ids.map(id=>`<i class="${id===curW()?'on':''}"></i>`).join('')}</div>`:''}
    <div id="hb"></div>
  </section>`;
  const car=$('#wcar'),i=ids.indexOf(curW());
  if(i>0)car.scrollLeft=car.children[i].offsetLeft-car.children[0].offsetLeft;
  let t=null;
  const nearest=()=>{const x=car.scrollLeft,o=car.children[0].offsetLeft;let best=0,bd=1e9;
    for(let k=0;k<ids.length;k++){const d=Math.abs(car.children[k].offsetLeft-o-x);if(d<bd){bd=d;best=k;}}return ids[best];};
  car.addEventListener('scroll',()=>{
    const id=nearest();if(id&&id!==curW()){S.settings.wallet=id;markCards();}
    clearTimeout(t);t=setTimeout(()=>{if(car.dataset.shown!==curW()){car.dataset.shown=curW();saveSettings();renderHomeBody();}},140);
  },{passive:true});

function renderHomeBody(){
  const m=inMonth(viewTx(),S.month).sort(byDateDesc);
  const exp=sumBy(m,'exp'),inc=sumBy(m,'inc');
  const mt=catTotals(inMonth(S.tx,S.month),'exp');let over=0,near=0;

  if(over||near){const parts=[];if(over)parts.push('превышено: '+over);if(near)parts.push('близко к лимиту: '+near);

  else if(!S.settings.onboarded&&!S.tx.length){const w0=S.wallets[0];

  h+=`<div class="sech"><h2>Операции</h2><span>${m.length?m.length+' за месяц':''}</span></div>`;

  else{h+=groupsHtml(m.slice(0,S.limit));if(m.length>S.limit)h+=`<button class="more" data-a="more">Показать ещё (${m.length-S.limit})</button>`;}
  $('#hb').innerHTML=h;S.lastId=null;

/* ================= аналитика ================= */
function donut(items,total){
  const R=78,C=2*Math.PI*R,Wd=22,gap=items.length>1?2.5:0;let off=0;
  return `<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Распределение по категориям"><circle r="${R}" cx="100" cy="100" fill="none" stroke="var(--fill)" stroke-width="${Wd}"/>${items.map(it=>{const full=it.v/total*C,len=Math.max(.5,full-gap);const s=`<circle class="s" r="${R}" cx="100" cy="100" fill="none" stroke="${it.color}" stroke-width="${Wd}" style="stroke-dasharray:0 ${C}" data-dash="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=full;return s;}).join('')}</svg>`;
}
const wChip=()=>{const w=curW()==='all'?ALLW:W(curW());return `<button class="chipbtn" data-a="openWallets">${esc(w.name)}${ic('down')}</button>`;};
function renderStats(){
  const type=S.statType,all=viewTx(),m=inMonth(all,S.month),tot=catTotals(m,type);
  const total=Object.values(tot).reduce((a,b)=>a+b,0);
  const items=Object.entries(tot).map(([id,v])=>({...catOf(id),v})).sort((a,b)=>b.v-a.v);
  const d=parseISO(S.month+'-01'),isCur=S.month===ym(new Date());
  const days=isCur?new Date().getDate():new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const months=[];for(let k=5;k>=0;k--){const mm=shiftMonth(S.month,-k);months.push({m:mm,v:sumBy(inMonth(all,mm),type)});}
  const max=Math.max(...months.map(x=>x.v),1),prev=months[4].v;
  let cmp='';if(prev>0&&total>0){const p=Math.round((total-prev)/prev*100),good=type==='exp'?p<=0:p>=0;cmp=p===0?'Как в прошлом месяце':`<span class="${good?'pos':'neg'}">${p>0?'+':'−'}${Math.abs(p)}%</span> к прошлому месяцу`;}
  const nz=months.filter(x=>x.v>0),avg=nz.length?nz.reduce((a,b)=>a+b.v,0)/nz.length:0;
  const col=type==='exp'?'var(--exp)':'var(--inc)';
  $('#main').innerHTML=`<section class="view stack">
    <div class="hh"><h1 class="lt">Аналитика</h1>${wChip()}</div>
    <div class="subrow">${mpick()}</div>
    <div class="seg" role="group" aria-label="Тип"><button data-a="stype" data-t="exp" aria-pressed="${type==='exp'}">Расходы</button><button data-a="stype" data-t="inc" aria-pressed="${type==='inc'}">Доходы</button></div>
    <div class="card pad">
      ${total>0?`<div class="donut-wrap">${donut(items,total)}<div class="donut-c"><span>${type==='exp'?'Расходы':'Доходы'}</span><b class="num">${money(total)}</b><span>${monthName(S.month)}</span></div></div>`:`<div class="empty" style="padding:24px 10px"><b>Нет данных</b><p>За этот месяц ещё нет ${type==='exp'?'расходов':'доходов'}.</p></div>`}
      <div class="minis" style="margin-top:12px"><div><span>Всего</span><b class="num">${short(total)}</b></div><div><span>В день</span><b class="num">${short(total/Math.max(1,days))}</b></div><div><span>Операций</span><b class="num">${m.filter(t=>t.type===type).length}</b></div></div>
    </div>
    ${items.length?`<div class="sec">По категориям</div><div class="list">${items.map(it=>{const p=it.v/total*100;return `<div class="brow" style="--c:${it.color}"><span class="h">${ciC(it)}<span class="nm"><b>${esc(it.name)}</b><span>${p<1?'<1':Math.round(p)}% от всех</span></span><span class="v num">${money(it.v)}</span></span><span class="bar"><i data-w="${p}"></i></span></div>`;}).join('')}</div>`:''}

let D=null;
const OPS='+−×÷';
function openEditor(id,type){
  const ex=id?S.tx.find(t=>t.id===id):null;
  const w=curW(),defW=w!=='all'?w:(S.settings.lastWallet&&W(S.settings.lastWallet)?S.settings.lastWallet:S.wallets[0].id);

      :{id:null,type:type||'exp',expr:'',cat:null,walletId:defW,toWallet:null,date:S.month===ym(new Date())?today():S.month+'-01',note:''};
  if(D.type==='tr'&&!D.toWallet)D.toWallet=(S.wallets.find(x=>x.id!==D.walletId)||{}).id;
  if(D.type!=='tr'&&!D.cat)D.cat=CATS[D.type][0].id;
  if(D.type!=='tr'&&!CAT[D.cat]&&LEGACY[D.cat])D.cat=LEGACY[D.cat];
  drawEditor();
}
function rowOrder(a){const out=[];for(let p=0;p<a.length;p+=10){const pg=a.slice(p,p+10),r1=pg.slice(0,5),r2=pg.slice(5);r1.forEach((x,i)=>{out.push(x);if(r2[i])out.push(r2[i]);});}return out;}
function wCell(label,id,act){const w=W(id)||{name:'Выбрать',icon:'wallet',color:'#7C8590'};return `<button class="cell" data-a="${act}"><span class="lab">${label}</span><span class="val">${miniW(w)}<span class="tn">${esc(w.name)}</span></span></button>`;}
function drawEditor(){
  const t=D.type,T=TYPES[t];
  const tabs=['exp','inc','tr'].map(k=>`<button data-a="edType" data-t="${k}" style="--c:${TYPES[k].c}" aria-pressed="${t===k}">${TYPES[k].l}</button>`).join('');
  const dateCell=`<label class="cell"><span class="lab">Дата</span><span class="val"><span class="tn" id="edDateL">${shortDate(D.date)}</span></span><input type="date" id="edDate" value="${D.date}" aria-label="Дата"></label>`;
  const noteCell=`<label class="cell note-c ${t==='tr'?'half':''}"><span class="lab">Заметка</span><input class="ninp" id="edNote" maxlength="80" placeholder="Необязательно" value="${esc(D.note)}" enterkeyhint="done"></label>`;
  const cats=t==='tr'?'':`<div class="cgrid ${CATS[t].length<=5?'one':''}" id="cats">${rowOrder(CATS[t]).map(c=>`<button class="cg" data-a="edCat" data-id="${c.id}" aria-pressed="${D.cat===c.id}" style="--c:${c.color}">${ciC(c)}<span>${esc(c.name)}</span></button>`).join('')}</div>`;
  const keys=['7','8','9','÷','4','5','6','×','1','2','3','−',',','0','⌫','+'].map(k=>`<button data-a="key" data-k="${k}" class="${OPS.includes(k)?'op':k==='⌫'||k===','?'fn':''}" aria-label="${k==='⌫'?'Стереть':k}">${k==='⌫'?ic('back'):k}</button>`).join('');
  openL(2,`<div class="ed">
    <div class="lhead"><button class="txtbtn l" data-a="close" data-l="2">Отмена</button><div class="tseg" role="group" aria-label="Тип операции">${tabs}</div><span class="r">${D.id?`<button class="trash" data-a="edDel" aria-label="Удалить">${ic('trash')}</button>`:'<span class="r-sp"></span>'}</span></div>
    <div class="amtp" id="amtp" style="--c:${T.c}"><div class="lb"><span>${T.a}</span><span class="ex num" id="edEx"></span></div><div class="big num" id="edAmt"></div></div>
    ${cats}
    <div class="duo">${t==='tr'?wCell('Откуда',D.walletId,'edWallet')+wCell('Куда',D.toWallet,'edWalletTo'):wCell('Счёт',D.walletId,'edWallet')+dateCell}${noteCell}${t==='tr'?dateCell:''}</div>
    <div class="kp">${keys}</div>
    <button class="save" data-a="edSave" id="edSave">${D.id?'Сохранить изменения':'Сохранить'}</button>
  </div>`,el=>{
    el.querySelector('#edDate').addEventListener('change',e=>{if(e.target.value){D.date=e.target.value;$('#edDateL').textContent=shortDate(D.date);}});
    el.querySelector('#edNote').addEventListener('input',e=>D.note=e.target.value);
    el.querySelector('#edNote').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
    const cg=el.querySelector('#cats'),sel=el.querySelector('.cg[aria-pressed="true"]');if(cg&&sel)cg.scrollLeft=Math.max(0,sel.offsetLeft-cg.offsetLeft-8);
    edUpdate();
  });
}
function fmtTyped(s){if(!s)return '0';const [a,b]=s.split(',');const n=a?nf.format(+a):'0';return s.includes(',')?n+','+(b||''):n;}
function evalExpr(e){
  const tk=(e.match(/[+−×÷]|[0-9,]+/g)||[]);while(tk.length&&OPS.includes(tk[tk.length-1]))tk.pop();
  if(!tk.length)return 0;
  const vals=[parseAmount(tk[0])],ops=[];
  for(let i=1;i<tk.length;i+=2){const op=tk[i],v=parseAmount(tk[i+1]);
    if(op==='×')vals[vals.length-1]*=v;else if(op==='÷')vals[vals.length-1]=v?vals[vals.length-1]/v:0;else{ops.push(op);vals.push(v);}}
  let r=vals[0];ops.forEach((op,i)=>{r=op==='+'?r+vals[i+1]:r-vals[i+1];});
  return Math.round(r*100)/100;
}
function edUpdate(){
  const e=D.expr,hasOp=/[+−×÷]/.test(e.slice(1));
  $('#edAmt').innerHTML=esc(hasOp?nf.format(evalExpr(e)):fmtTyped(e))+'<small>₸</small>';
  $('#edEx').textContent=hasOp?e.split(/([+−×÷])/).map(x=>OPS.includes(x)?' '+x+' ':fmtTyped(x)).join('')+' =':'';
  const ok=evalExpr(e)>0&&(D.type!=='tr'||(D.walletId&&D.toWallet&&D.walletId!==D.toWallet));
  $('#edSave').classList.toggle('off',!ok);
}
function edKey(k){
  let e=D.expr;const last=e.split(/[+−×÷]/).pop();
  if(k==='⌫')e=e.slice(0,-1);
  else if(OPS.includes(k)){if(!e)return;const lc=e.slice(-1);if(OPS.includes(lc)||lc===',')e=e.slice(0,-1)+k;else e+=k;}
  else if(k===','){if(last.includes(','))return;e+=last===''?'0,':',';}
  else{if(last==='0')e=e.slice(0,-1)+k;else{if(last.includes(',')&&last.split(',')[1].length>=2)return;if(last.replace(',','').length>=10)return;e+=k;}}
  D.expr=e;edUpdate();
}
function edSave(){
  const a=evalExpr(D.expr);
  if(!(a>0)){const b=$('#amtp');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return;}
  if(D.type==='tr'&&(!D.toWallet||D.toWallet===D.walletId)){toast('Выберите два разных счёта');return;}
  const rec={type:D.type,amount:a,cat:D.type==='tr'?'transfer':D.cat,walletId:D.walletId,date:D.date,note:(D.note||'').trim()};
  if(D.type==='tr')rec.toWallet=D.toWallet;
  let t;
  if(D.id){t=S.tx.find(x=>x.id===D.id);Object.assign(t,rec);if(D.type!=='tr')delete t.toWallet;}
  else{t=Object.assign({id:uid(),ts:Date.now()},rec);S.tx.push(t);}
  DB.putTx(t);S.lastId=t.id;S.settings.lastWallet=D.walletId;S.settings.onboarded=true;saveSettings();
  S.month=D.date.slice(0,7);closeL(2);refresh();toast(D.id?'Изменения сохранены':'Сохранено');
}

  WE={id:w?w.id:null,icon:w?w.icon:'card',color:w?w.color:WCOLORS[S.wallets.length%WCOLORS.length]};
  const cnt=w?S.tx.filter(t=>t.walletId===w.id||t.toWallet===w.id).length:0;
  const draw=(name,bal)=>openL(3,`<div class="lhead"><button class="txtbtn l" data-a="close" data-l="3">Отмена</button><h2>${w?'Счёт':'Новый счёт'}</h2><button class="txtbtn b r" data-a="wSave">Готово</button></div>
  <div class="stack">
    <div class="prev"><div class="wcard on" style="--c:${WE.color}"><div class="wc-top"><span class="wc-ic">${ic(WE.icon)}</span><span class="wc-n" id="wPrevN">${esc(name||'Новый счёт')}</span></div><div class="wc-l">Остаток</div><div class="wc-b num" id="wPrevB">${money(parseAmount(bal||'0'))}</div></div></div>
    <div class="form">
      <div class="field"><label for="wName">Название</label><input id="wName" maxlength="24" placeholder="Например, Карта" value="${esc(name)}"></div>
      <div class="field"><label for="wBal">Сейчас на счёте</label><input id="wBal" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(bal)}"><span class="u">₸</span></div>
    </div>
    <p class="note">${w?'Если исправить сумму, операции не изменятся: приложение пересчитает стартовый остаток.':'Укажите, сколько денег на счёте сейчас. Дальше остаток будет меняться сам.'}</p>
    <div class="sec" style="padding-top:2px">Иконка</div>
    <div class="picks">${WICONS.map(n=>`<button class="icb" data-a="wIcon" data-v="${n}" aria-pressed="${WE.icon===n}" aria-label="Иконка">${ic(n)}</button>`).join('')}</div>
    <div class="sec" style="padding-top:2px">Цвет</div>
    <div class="picks">${WCOLORS.map(c=>`<button class="sw" data-a="wColor" data-v="${c}" style="--c:${c}" aria-pressed="${WE.color===c}" aria-label="Цвет"></button>`).join('')}</div>
    ${w&&S.wallets.length>1?`<button class="btn danger" data-a="wDel">Удалить счёт${cnt?' и '+cnt+' операц.':''}</button>`:''}
  </div>`,el=>{
    const n=el.querySelector('#wName'),b=el.querySelector('#wBal');
    n.addEventListener('input',()=>$('#wPrevN').textContent=n.value||'Новый счёт');
    b.addEventListener('input',()=>$('#wPrevB').textContent=money(parseAmount(b.value||'0')));
  });
  draw(w?w.name:'',w?String(Math.round(balance(w.id)*100)/100).replace('.',','):'');
  WE.redraw=()=>draw($('#wName').value,$('#wBal').value);
}
function walletSave(){
  const name=($('#wName').value||'').trim()||'Счёт',bal=parseAmount($('#wBal').value);
  if(WE.id){const w=W(WE.id);w.name=name;w.icon=WE.icon;w.color=WE.color;w.initial=Math.round((bal-net(w.id))*100)/100;}
  else{const w=newWallet({name,icon:WE.icon,color:WE.color,initial:bal});S.wallets.push(w);}
  S.settings.onboarded=true;saveSettings();saveWallets();closeL(3);refresh();
  if(D&&$('#l2').classList.contains('on'))drawEditor();
  toast('Счёт сохранён');
}

/* ================= лимит ================= */
function openBudgetEdit(id){
  const c=catOf(id),cur=S.budgets[id]||0;
  openL(3,`<div class="lhead"><button class="txtbtn l" data-a="close" data-l="3">Отмена</button><h2>Лимит на месяц</h2><button class="txtbtn b r" data-a="bSave" data-id="${id}">Готово</button></div>
  <div class="stack">
    <div class="bhead">${ciC(c)}<b>${esc(c.name)}</b></div>
    <div class="bigin"><input id="bLim" inputmode="decimal" autocomplete="off" placeholder="0" value="${cur?nf.format(cur):''}" aria-label="Лимит"><span>₸</span></div>
    <div class="seg">${[20000,50000,100000,150000].map(v=>`<button data-a="bQuick" data-v="${v}" aria-pressed="false">${short(v)}</button>`).join('')}</div>
    ${cur?`<button class="btn danger" data-a="bDel" data-id="${id}">Убрать лимит</button>`:''}
  </div>`,el=>{const i=el.querySelector('#bLim');i.addEventListener('keydown',e=>{if(e.key==='Enter')budgetSave(id);});setTimeout(()=>{try{i.focus();}catch(e){}},300);});
}
function budgetSave(id){const v=parseAmount($('#bLim').value);if(v>0)S.budgets[id]=v;else delete S.budgets[id];saveBudgets();closeL(3);refresh();toast(v>0?'Лимит сохранён':'Лимит убран');}

/* ================= резервная копия ================= */
async function exportData(){
  const data=JSON.stringify({app:'moi-budget',version:3,exported:new Date().toISOString(),wallets:S.wallets,tx:S.tx,budgets:S.budgets,subs:S.subs,rates:S.settings.rates||null});
  const name='budget-'+today()+'.json';
  try{const f=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Резервная копия бюджета'});toast('Копия готова');return;}}
  catch(e){if(e&&e.name==='AbortError')return;}
  try{const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Файл сохранён в «Загрузки»');}
  catch(e){toast('Не удалось сохранить файл');}
}
function importFile(f){
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);if(!j||!Array.isArray(j.tx))throw 0;
    if(Array.isArray(j.wallets))j.wallets.forEach(w=>{if(w&&w.id&&!W(w.id))S.wallets.push(newWallet({id:String(w.id),name:String(w.name||'Счёт'),icon:WICONS.includes(w.icon)?w.icon:'wallet',color:/^#[0-9a-f]{6}$/i.test(w.color)?w.color:'#7C8590',initial:+w.initial||0}));});
    const def=S.wallets[0].id,have=new Set(S.tx.map(t=>t.id));
    const fresh=j.tx.filter(t=>t&&t.id&&!have.has(t.id)&&['exp','inc','tr'].includes(t.type)&&+t.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)).map(t=>{const o={id:String(t.id),type:t.type,amount:+t.amount,cat:String(t.cat||''),date:t.date,note:String(t.note||''),ts:+t.ts||0,walletId:W(t.walletId)?t.walletId:def};if(t.type==='tr'){o.toWallet=W(t.toWallet)?t.toWallet:def;o.cat='transfer';}return o;});
    S.tx.push(...fresh);DB.putMany(fresh);saveWallets();
    if(Array.isArray(j.subs)){j.subs.forEach(x=>{if(x&&x.id&&x.name&&+x.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(x.next)&&!S.subs.some(z=>z.id===x.id))S.subs.push({id:String(x.id),name:String(x.name),icon:SUBICONS.includes(x.icon)?x.icon:'repeat',color:/^#[0-9a-f]{6}$/i.test(x.color)?x.color:'#5B5BD6',amount:+x.amount,currency:CUR[x.currency]?x.currency:'KZT',period:PERIODS[x.period]?x.period:'month',next:x.next,anchor:+x.anchor||parseISO(x.next).getDate(),walletId:W(x.walletId)?x.walletId:def,auto:x.auto!==false,active:x.active!==false});});saveSubs();}
    if(j.rates&&+j.rates.USD>0&&+j.rates.RUB>0&&!S.settings.rates)S.settings.rates={USD:+j.rates.USD,RUB:+j.rates.RUB};
    if(j.budgets&&typeof j.budgets==='object'){Object.entries(j.budgets).forEach(([k,v])=>{if(+v>0)S.budgets[k]=+v;});saveBudgets();}
    S.settings.onboarded=true;S.settings.demo=false;saveSettings();refresh();toast(fresh.length?'Добавлено операций: '+fresh.length:'Новых операций в файле нет');
  }catch(e){toast('Этот файл не похож на копию бюджета');}};
  r.readAsText(f);
}
function resetAll(){
  S.tx=[];S.budgets={};S.subs=[];saveSubs();DB.clearTx();updateBadge();
  S.wallets=[newWallet({id:'w_main'})];S.settings.wallet='w_main';S.settings.demo=false;S.settings.onboarded=false;S.settings.lastWallet=null;
  saveWallets();saveBudgets();saveSettings();S.month=ym(new Date());
}

/* ================= уведомления ================= */
let toastT=null;
function toast(msg,label,act){
  const el=$('#toast');el.innerHTML=`<span>${esc(msg)}</span>`;
  if(label){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{act();el.classList.remove('on');};el.appendChild(b);}
  el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),label?5000:2200);
}
function refresh(){render();if(S.sheet==='wallets')drawWallets();else if(S.sheet==='search'){const q=$('#qres');if(q)q.innerHTML=searchResults();}}

/* ================= свайп для удаления ================= */
const SWW=92;let swOpen=null,swJust=0;
function hideRev(w){setTimeout(()=>{if(!w.classList.contains('open')&&!w.querySelector('.row.drag'))w.classList.remove('rev');},300);}
function swClose(except){if(swOpen&&swOpen!==except){const w=swOpen,r=w.querySelector('.row');r.style.transform='';w.classList.remove('open');swOpen=null;hideRev(w);}}
function deleteTx(id,wrap){
  const ex=S.tx.find(t=>t.id===id);if(!ex)return;const copy={...ex};
  const done=()=>{S.tx=S.tx.filter(t=>t.id!==id);DB.delTx(id);swOpen=null;refresh();
    toast('Операция удалена','Вернуть',()=>{S.tx.push(copy);DB.putTx(copy);refresh();});};
  if(wrap&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const h=wrap.offsetHeight;wrap.classList.add('rev');wrap.style.height=h+'px';
    const r=wrap.querySelector('.row');r.style.transform='translateX(-100%)';
    requestAnimationFrame(()=>{wrap.style.height='0px';wrap.style.opacity='0';});
    setTimeout(done,300);
  }else done();
}
(function(){
  let st=null;
  document.addEventListener('pointerdown',e=>{
    const row=e.target.closest('.sw > .row');
    if(!row){if(swOpen&&!e.target.closest('.swdel'))swClose();return;}
    const wrap=row.parentNode;if(swOpen&&swOpen!==wrap)swClose();
    st={row,wrap,x:e.clientX,y:e.clientY,base:wrap.classList.contains('open')?-SWW:0,lock:null,dx:0,id:e.pointerId};
  },{passive:true});
  document.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.id)return;
    const dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(st.lock===null){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;st.lock=Math.abs(dx)>Math.abs(dy)?'h':'v';if(st.lock==='h'){st.row.classList.add('drag');st.wrap.classList.add('rev');}}
    if(st.lock!=='h')return;
    let x=Math.min(0,st.base+dx);const w=st.wrap.offsetWidth;
    if(x<-SWW)x=-SWW+(x+SWW)*.85;
    st.dx=x;st.row.style.transform=`translateX(${x}px)`;
    st.wrap.classList.toggle('full',x<-w*.6);
  },{passive:true});
  const end=e=>{
    if(!st||(e&&e.pointerId!==st.id))return;const s=st;st=null;
    if(s.lock!=='h')return;
    s.row.classList.remove('drag');swJust=Date.now();
    const w=s.wrap.offsetWidth;
    if(s.dx<-w*.6){deleteTx(s.wrap.dataset.id,s.wrap);return;}
    if(s.dx<-SWW/2){s.row.style.transform=`translateX(${-SWW}px)`;s.wrap.classList.add('open');s.wrap.classList.remove('full');swOpen=s.wrap;}
    else{s.row.style.transform='';s.wrap.classList.remove('open','full');if(swOpen===s.wrap)swOpen=null;hideRev(s.wrap);}
  };
  document.addEventListener('pointerup',end,{passive:true});
  document.addEventListener('pointercancel',e=>{if(st&&st.lock==='h')end(e);else st=null;},{passive:true});
})();

/* ================= обработка нажатий ================= */
function arm(b,label,fn){if(!b.classList.contains('armed')){const old=b.textContent;b.classList.add('armed');b.textContent=label;setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent=old;}},3500);return;}fn();}
const ACT={
  noop:()=>{},
  goSubs:()=>{S.tab='budgets';S.budTab='subs';window.scrollTo(0,0);render();},
  budTab:b=>{S.budTab=b.dataset.t;render();},
  subNew:b=>openSubEdit(null,b.dataset.p!=null?+b.dataset.p:null),
  subEdit:b=>openSubEdit(b.dataset.id),
  subPreset:b=>{const q=SUBPRESETS[+b.dataset.p];SE.name=q[0];SE.icon=q[1];SE.color=q[2];SE.currency=q[3];$('#sName').value=q[0];subMark('subIcon',SE.icon);subMark('subColor',SE.color);subMark('subCur',SE.currency);subPrev();try{$('#sAmt').focus();}catch(e){}},
  subCur:b=>{SE.currency=b.dataset.v;subMark('subCur',SE.currency);subPrev();},
  subPer:b=>{SE.period=b.dataset.v;subMark('subPer',SE.period);},
  subIcon:b=>{SE.icon=b.dataset.v;subMark('subIcon',SE.icon);subPrev();},
  subColor:b=>{SE.color=b.dataset.v;subMark('subColor',SE.color);subPrev();},
  subAuto:b=>{SE.auto=!SE.auto;b.setAttribute('aria-checked',SE.auto);},
  subActive:b=>{SE.active=!SE.active;b.setAttribute('aria-checked',SE.active);},
  subSave:()=>subSave(),
  subDel:b=>arm(b,'Нажмите ещё раз для удаления',()=>{S.subs=S.subs.filter(z=>z.id!==SE.id);saveSubs();closeL(3);refresh();updateBadge();toast('Платёж удалён. Прошлые расходы остались');}),
  fetchRates:async b=>{b.disabled=true;const old=b.textContent;b.textContent='Обновляю…';
    try{const r=await fetch('https://open.er-api.com/v6/latest/KZT',{cache:'no-store'});const j=await r.json();
      if(!j||!j.rates||!j.rates.USD||!j.rates.RUB)throw 0;
      S.settings.rates={USD:Math.round(100/j.rates.USD)/100,RUB:Math.round(1000/j.rates.RUB)/1000};S.settings.ratesDate=today();saveSettings();renderSubs();toast('Курс обновлён');}
    catch(e){b.disabled=false;b.textContent=old;toast('Не получилось: нет интернета. Впишите курс вручную');}},
  badgeTg:async b=>{
    if(S.settings.badge){S.settings.badge=false;saveSettings();updateBadge();b.setAttribute('aria-checked','false');return;}
    if(!('setAppBadge' in navigator)||!('Notification' in window)){toast('Работает в приложении с экрана «Домой», iOS 16.4+');return;}
    try{const p=await Notification.requestPermission();
      if(p==='granted'){S.settings.badge=true;saveSettings();updateBadge();b.setAttribute('aria-checked','true');toast('Цифра на иконке включена');}
      else toast('Разрешите уведомления: Настройки → Уведомления → Бюджет');}catch(e){toast('Не удалось включить');}},
  close:b=>closeL(+b.dataset.l),
  tab:b=>{const t=b.dataset.t;if(S.tab===t){window.scrollTo({top:0,behavior:'smooth'});return;}S.tab=t;S.limit=40;window.scrollTo(0,0);render();},
  goStats:b=>{S.statType=b.dataset.t;S.tab='stats';window.scrollTo(0,0);render();},
  openWallets:()=>openWallets(),
  openSearch:()=>openSearch(),
  selCard:(b,e)=>{if(e.target.closest('.wc-ed'))return;const car=$('#wcar');if(car)car.scrollTo({left:b.offsetLeft-car.children[0].offsetLeft,behavior:'smooth'});},
  pickWallet:b=>{S.settings.wallet=b.dataset.id;saveSettings();closeL(1);render();},
  walletEdit:b=>openWalletEdit(b.dataset.id),
  wIcon:b=>{WE.icon=b.dataset.v;WE.redraw();},
  wColor:b=>{WE.color=b.dataset.v;WE.redraw();},
  wSave:()=>walletSave(),
  wDel:b=>arm(b,'Нажмите ещё раз для удаления',()=>{
    const id=WE.id,ids=S.tx.filter(t=>t.walletId===id||t.toWallet===id).map(t=>t.id);
    S.tx=S.tx.filter(t=>!ids.includes(t.id));DB.delMany(ids);S.wallets=S.wallets.filter(w=>w.id!==id);
    if(S.settings.wallet===id)S.settings.wallet='all';saveWallets();saveSettings();closeL(3);refresh();toast('Счёт удалён');}),
  skipOnb:()=>{S.settings.onboarded=true;saveSettings();render();},
  clearDemo:()=>{resetAll();refresh();toast('Готово, можно начинать');},
  add:b=>openEditor(null,b.dataset.t),
  edit:b=>{if(Date.now()-swJust<350)return;const w=b.parentNode;if(w.classList&&w.classList.contains('open')){swClose();return;}openEditor(b.dataset.id);},
  swDel:b=>deleteTx(b.dataset.id,b.closest('.sw')),
  edType:b=>{const t=b.dataset.t;if(D.type===t)return;
    if(t==='tr'&&S.wallets.length<2){toast('Сначала добавьте второй счёт');return;}
    D.type=t;if(t==='tr')D.toWallet=(S.wallets.find(x=>x.id!==D.walletId)||{}).id;else D.cat=CATS[t][0].id;drawEditor();},
  edCat:b=>{D.cat=b.dataset.id;$$('#cats .cg').forEach(c=>c.setAttribute('aria-pressed',c.dataset.id===D.cat));},
  key:b=>edKey(b.dataset.k),
  edSave:()=>edSave(),
  edWallet:()=>openWalletPick('from'),
  edWalletTo:()=>openWalletPick('to'),
  pickEdW:b=>{if(b.dataset.t==='to')D.toWallet=b.dataset.id;else{D.walletId=b.dataset.id;if(D.type==='tr'&&D.toWallet===D.walletId)D.toWallet=(S.wallets.find(x=>x.id!==D.walletId)||{}).id;}closeL(3);drawEditor();},
  edDel:b=>{
    if(!b.classList.contains('armed')){b.classList.add('armed');toast('Нажмите ещё раз, чтобы удалить');setTimeout(()=>{if(b.isConnected)b.classList.remove('armed');},3000);return;}
    closeL(2);deleteTx(D.id);},
  mprev:()=>{S.month=shiftMonth(S.month,-1);S.limit=40;render();},
  mnext:()=>{S.month=shiftMonth(S.month,1);S.limit=40;render();},
  mnow:()=>{S.month=ym(new Date());render();},
  more:()=>{S.limit+=60;renderHomeBody();},
  stype:b=>{S.statType=b.dataset.t;renderStats();},
  budgetEdit:b=>openBudgetEdit(b.dataset.id),
  bQuick:b=>{$('#bLim').value=nf.format(+b.dataset.v);},
  bSave:b=>budgetSave(b.dataset.id),
  bDel:b=>{delete S.budgets[b.dataset.id];saveBudgets();closeL(3);refresh();toast('Лимит убран');},
  theme:b=>{S.settings.theme=b.dataset.v;saveSettings();applyTheme();$$('[data-a="theme"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===S.settings.theme));},
  accent:b=>{S.settings.accent=b.dataset.v;saveSettings();applyColors();renderSettings();},
  tone:b=>{S.settings.tone=b.dataset.v;saveSettings();applyColors();renderSettings();},
  resetColors:()=>{S.settings.accent=null;S.settings.tone='graphite';saveSettings();applyColors();renderSettings();toast('Стандартные цвета');},
  export:()=>exportData(),
  import:()=>{const i=$('#fImport');i.onchange=e=>{const f=e.target.files[0];if(f)importFile(f);i.value='';};i.click();},
  wipe:b=>arm(b,'Нажмите ещё раз — удалить всё',()=>{resetAll();S.tab='home';render();toast('Все данные удалены');})
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=ACT[b.dataset.a];if(f)f(b,e);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const n=topLayer();if(n)closeL(n);return;}
  if(topLayer()===2&&D&&!(document.activeElement&&document.activeElement.tagName==='INPUT')){
    const map={'*':'×','/':'÷','-':'−','+':'+','.':',',',':',','Backspace':'⌫'};
    if(/^[0-9]$/.test(e.key))edKey(e.key);else if(map[e.key])edKey(map[e.key]);else if(e.key==='Enter')edSave();else return;
    e.preventDefault();
  }
});

/* ================= запуск ================= */
(async function init(){
  const ok=await DB.open();
  if(ok){const [tx,b,st,ws,sb]=await Promise.all([DB.allTx(),DB.get('budgets'),DB.get('settings'),DB.get('wallets'),DB.get('subs')]);
    S.tx=tx||[];S.budgets=b||{};if(st)Object.assign(S.settings,st);S.wallets=Array.isArray(ws)?ws:[];S.subs=Array.isArray(sb)?sb:[];}
  if(!S.settings.seeded&&!S.tx.length&&inFrame){
    const d=seedDemo();S.wallets=d.wallets;S.tx=d.tx;S.subs=d.subs;saveSubs();S.budgets={cafe:50000,food:150000,transport:30000,fun:25000,home:200000};
    S.settings.seeded=true;S.settings.demo=true;S.settings.onboarded=true;S.settings.wallet='all';
    DB.putMany(S.tx);saveBudgets();saveWallets();saveSettings();
  }
  if(!S.wallets.length){S.wallets=[newWallet({id:'w_main'})];if(S.settings.wallet==='all')S.settings.wallet='w_main';saveWallets();}
  const def=S.wallets[0].id,fix=[];
  S.tx.forEach(t=>{if(!t.walletId||!W(t.walletId)){t.walletId=def;fix.push(t);}if(t.type==='tr'&&!W(t.toWallet)){t.toWallet=def;fix.push(t);}});
  if(fix.length)DB.putMany(fix);
  if(S.tx.length&&!S.settings.onboarded){S.settings.onboarded=true;saveSettings();}
  const charged=processSubs();
  applyTheme();render();chargedToast(charged);updateBadge();
  document.addEventListener('visibilitychange',()=>{if(document.hidden)return;const c=processSubs();if(c.length){refresh();chargedToast(c);}else if(S.tab==='home')renderHomeBody();updateBadge();});
  try{if(!inFrame&&navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  try{if(!inFrame&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
})();
})();
